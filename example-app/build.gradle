apply plugin: 'com.android.application'

android {
    namespace "backtraceio.backtraceio"
    defaultConfig {
        compileSdk 36
        applicationId "backtraceio.backtraceio"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            // -PqualificationAbi=<abi> builds a single-ABI qualification app for the hardware
            // release gate (for example a 32-bit-only install on a 64-bit device). The library's
            // published ABI set is unaffected.
            def qualificationAbi = project.findProperty("qualificationAbi")
            if (qualificationAbi) {
                abiFilters qualificationAbi.toString()
            } else {
                abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    // Debug-only startup-qualification fixture: -PnativeStartupFixtureAssets=<dir> adds a
    // generated large-entry-count asset directory (never committed) to the debug APK so a trace
    // can prove initialization cost does not scale with ZIP central-directory size.
    def nativeStartupFixtureAssets = project.findProperty("nativeStartupFixtureAssets")
    if (nativeStartupFixtureAssets) {
        sourceSets {
            debug {
                assets.srcDirs += nativeStartupFixtureAssets.toString()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }

    android {
        lint {
            abortOnError = true
            checkReleaseBuilds = true
            baseline = file('lint-baseline.xml')
        }
        defaultConfig {
            buildConfigField ("String", "BACKTRACE_SUBMISSION_URL", getProperty("BACKTRACE_SUBMISSION_URL", "null"))
            buildConfigField ("String", "BACKTRACE_CORONER_URL", getProperty("BACKTRACE_CORONER_URL", "null"))
            buildConfigField ("String", "BACKTRACE_CORONER_TOKEN", getProperty("BACKTRACE_CORONER_TOKEN", "null"))
        }
        buildFeatures {
            buildConfig = true
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
       }
    }


}

String getProperty(String name, String defaultValue) {
    if (!rootProject.file("./local.properties").exists()) {
        return defaultValue
    }
    def properties = new Properties()
    properties.load(rootProject.file("./local.properties").newDataInputStream())
    return properties.containsKey(name) ? properties[name] : defaultValue
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'net.jodah:concurrentunit:0.4.6'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation project(':backtrace-library')
    androidTestImplementation project(path: ':coroner-client')
}

tasks.preBuild.dependsOn(':gson:shadowJar')
