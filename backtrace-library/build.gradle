plugins {
    id 'com.android.library'
    id 'com.gladed.androidgitversion' version '0.4.14'
    id "com.vanniktech.maven.publish" version "0.34.0" apply true
}

androidGitVersion {
    // this is the format for generating the versionName
    // default is %tag%%-count%%-commit%%-branch%%-dirty% - removed %-dirty% because submodules tend to get dirty
    format '%tag%%-count%%-commit%%-branch%'
}

def libVersion = androidGitVersion.name()

if (libVersion == null || libVersion.trim().isEmpty() || libVersion.trim() == 'null') {
    throw new GradleException("androidGitVersion.name() resolved to '${libVersion}'. " +
            "The library version could not be determined. Make sure the git history and tags are available.")
}

android {
    namespace = "backtraceio.library"
    enableKotlin = false
    compileSdk = 36
    defaultConfig {
        minSdk = 21
        ndkVersion = '27.3.13750724'
        buildConfigField("String", "VERSION_NAME", "\"${libVersion}\"")
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DCMAKE_BUILD_TYPE=Release"
                arguments "-DCRASHPAD_HTTPS_TRANSPORT=OPENSSL"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
        buildFeatures {
            buildConfig = true
        }
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
    }

    testCoverage {
        jacocoVersion = "0.8.13"
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version "3.31.6"
        }
    }
    sourceSets {
        main {
        }
        androidTest.manifest.srcFile "src/androidTest/java/backtraceio/library/AndroidManifest.xml"
    }

    lint {
        abortOnError = true
        targetSdk = 36
        checkReleaseBuilds = true
        baseline = file('lint-baseline.xml')
    }
    testOptions {
        targetSdk = 36
    }
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    coordinates(GROUP, POM_NAME, libVersion)

    pom {
        name = POM_NAME
        description = POM_DESCRIPTION
        url = POM_URL

        licenses {
            license {
                name = POM_LICENSE_NAME
                url = POM_LICENSE_URL
                distribution = POM_LICENSE_DIST
            }
        }

        developers {
            developer {
                id = POM_DEVELOPER_ID
                name = POM_DEVELOPER_NAME
            }
            developer {
                id = POM_DEVELOPER_ID2
                name = POM_DEVELOPER_NAME2
            }
            developer {
                id = POM_DEVELOPER_ID3
                name = POM_DEVELOPER_NAME3
            }
        }

        scm {
            url = POM_SCM_URL
            connection = POM_SCM_CONNECTION
            developerConnection = POM_SCM_DEV_CONNECTION
        }
    }
}

def shadedGsonJar = project(":gson").provider {
    project(":gson")
            .tasks
            .named("shadowJar")
            .get()
            .archiveFile
}

dependencies {
    implementation 'com.squareup:tape:1.2.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation(files(shadedGsonJar))
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.mockito:mockito-core:5.19.0"
    testImplementation 'org.json:json:20250517'
    testImplementation "com.google.guava:guava:33.4.8-jre"
    androidTestImplementation 'net.jodah:concurrentunit:0.4.6'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "org.mockito:mockito-android:5.19.0"
}

afterEvaluate {
    preBuild.dependsOn(":gson:shadowJar")
}
